<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 체질량 지수(BMI)</title>
    <link rel="stylesheet" href="./css/ex2.css">
</head>
<body>
    <main class="wrap">
        <header class="intro">
            <span class="issue">Health Report · 2026</span>
            <h1>나의 체질량<br>지수 <em>(BMI)</em></h1>
            <p>체질량지수는 자신의 몸무게(kg)를 키의 제곱(m)으로 나눈 값입니다. 체질량지수는 근육량, 유전적 요인, 다른 개인의 차이를 반영하지 못하는 한계점이 있음에도 불구하고 조사자들이나 의료인들이 가장 많이 쓰는 방법 중 하나입니다.</p>
        </header>

        <section class="report" aria-label="개인 BMI 리포트">
            <dl>
                <script>

                    const getMarkerLeft = bmi => {
                        if (bmi < 15) return 0;
                        if (bmi < 18.5) {
                            return ((bmi - 15) / (18.5 - 15)) * 20.689655;
                        }
                        if (bmi < 23) {
                            return 20.689655 + ((bmi - 18.5) / (23 - 18.5)) * 32.183908;
                        }
                        if (bmi < 25) {
                            return 52.873563 + ((bmi - 23) / (25 - 23)) * 17.241379;
                        }
                        if (bmi <= 30) {
                            return 70.114942 + ((bmi - 25) / (30 - 25)) * 29.885057;
                        }
                        return 100;
                        };

                        

            let userName = prompt("이름 입력")
            let userWeight = Number(prompt("체중 입력(kg)"))
            let userHeight = Number(prompt("키 입력(cm)"))
            let bmi = (userWeight / ((userHeight/100)**2)).toFixed(2)
            let makerLeft = getMarkerLeft(bmi)
            let grade = bmi>=25?'비만':bmi>=23?'과체중':bmi>=18.5?'정상':'저체중'

                    document.write(`<div>
                    <dt>이름</dt>
                    <dd>${userName}</dd>
                </div>
                <div>
                    <dt>체중</dt>
                    <dd>${userWeight}<small>kg</small></dd>
                </div>
                <div>
                    <dt>키</dt>
                    <dd>${userHeight}<small>cm</small></dd>
                </div>
                <div class="bmi-score">
                    <dt>BMI 지수</dt>
                    <dd>${bmi}</dd>
                </div>
                <div class="bmi-grade">
                    <dt>상태</dt>
                    <dd>${grade}</dd>
                </div>
                `)
                </script>
                
            </dl>

            <div class="graph" aria-label="BMI 구간 그래프: 현재 BMI 21.8, 정상 범위">
                <div class="graph-heading">
                    <div>
                        <span class="eyebrow">Body Mass Index</span>
                        <h2>BMI Range</h2>
                    </div>
                    <script>
            document.write(`<p><strong>${bmi}</strong><span>${grade}</span></p>`)
                    </script>
                </div>
                <div class="bar" role="img" aria-label="저체중, 정상, 과체중, 비만으로 구분된 BMI 막대">
                    <span class="range under"><b>저체중</b><small>18.5 미만</small></span>
                    <span class="range normal"><b>정상</b><small>18.5–22.9</small></span>
                    <span class="range over"><b>과체중</b><small>23–24.9</small></span>
                    <span class="range obese"><b>비만</b><small>25 이상</small></span>
                    <script>
                        document.write(`<i class="marker" aria-hidden="true" style="left:${makerLeft}%;"></i>`)
                    </script>
                    
                </div>
                <div class="scale" aria-hidden="true">
                    <span>15</span><span>18.5</span><span>23</span><span>25</span><span>30+</span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
