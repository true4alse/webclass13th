<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>값으로서 사용되는 함수</title>
</head>
<body>
    <script>

        a()
        function a(){
            alert('aaa')
        }

        
        let b = function(){
            alert('bbb')
        }
        b()        

        let c = ()=>{
            alert('ccc')
        }
        c()

        let d = (name)=>{
            alert(name+"님 반갑습니다.")
        }
        d('정현진')

        let g = name => alert(name+"님 반갑습니다.")
        g('김예림')

        let sum = (a,b)=>{
            return a+b
        }
        // alert(sum(1,2))

        let sum2 = (a,b)=>a+b
        alert(sum2(10,20))


        function abc(a){
            a()
        }
        abc(function(){alert('test')})


    </script>
</body>
</html>
